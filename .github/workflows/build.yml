name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Android SDK
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME -and (Test-Path "C:\Android\android-sdk")) {
            $env:ANDROID_HOME = "C:\Android\android-sdk"
          }
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Get-ChildItem "$env:ANDROID_HOME\platforms" -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem "$env:ANDROID_HOME\build-tools" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Build release APK
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME -and (Test-Path "C:\Android\android-sdk")) {
            $env:ANDROID_HOME = "C:\Android\android-sdk"
          }
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\build.ps1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-release-ci
          path: dist/SmsForwarder-release.apk
          if-no-files-found: error
